<div style="padding: 20px; font-family: Arial;">
  <h1>Social Agent Dashboard</h1>
  
  <div style="background: #f0f0f0; padding: 15px; border-radius: 8px; margin-bottom: 10px; min-height: 50px;">
    <strong>AI Response:</strong>
    <p>{{ backendMessage }}</p>
  </div>

  <div style="display: flex; gap: 10px;">
    <input [(ngModel)]="userQuery" placeholder="Ask Your Agent to write a tweet..." style="padding: 10px; flex: 1;">
    
    <button (click)="sendToAi()" [disabled]="isLoading" style="padding: 10px 20px; cursor: pointer;">
      {{ isLoading ? 'Thinking...' : 'Ask AI' }}
    </button>
     
    <button (click)="postToX()" [disabled]="isLoading" style="padding: 10px 20px; background: #000; color: white; border: none; border-radius: 4px; cursor: pointer; min-width: 100px;">
      Post to X
    </button>
  </div>
</div>
